---
name: test
on:
  push:
    branches:
      - develop
    paths:
      - coit-backend1/**
  workflow_dispatch: null
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: "11"
          distribution: temurin
      - name: Read Version
        id: read_version
        run: >
          $config = "DE"

          $fileContent = Get-Content "${{ github.workspace }}\versions.yml" | Out-String

          Write-Output "File Content: $fileContent"  # Debugging line

          $regex = [regex]"$($config):\s*""(.+?)"""

          Write-Output "Regex: $regex"  # Debugging line

          if ($fileContent -match $regex) {

          $version = $matches[1]
           Write-Output "Version_current: $version"
           echo "::set-output name=version::$version"
          } 
      - name: Increment Version
        id: increment_version
        run: |
          $current_version = $env:INPUT_VERSION
          $incremented_version = $current_version -split'\.'
          $incremented_version[-1] = [int]$incremented_version[-1]+1
          $incremented_version = $incremented_version -join'.'
          Write-Output "Incremented Version: $incremented_version"
          echo "::set-output name=incremented_version::$incremented_version"
        env:
          INPUT_VERSION: ${{ steps.read_version.outputs.version }}
        shell: PowerShell
        
      - name: Set up Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"  
          
      - name: Update Version in release-version in versions-de.yml
        run: >
          # Define the config and read the content of the versions.yml file

          $config = "DE"
          
          $incremented_version = $env:INPUT_VERSION

          $file_path = "${{ github.workspace }}\versions.yml"
          
          $fileContent = Get-Content $file_path | Out-String
          
          $updatedContent = $fileContent -replace "$($config):\s*""(.+?)""", "$($config): `"$incremented_version`""
          
          Set-Content -Path $file_path -Value $updatedContent
          
          # Git operations to commit the change
          git add "${{ github.workspace }}\versions.yml"
          git commit -m "Update version for $config to $incremented_version"
          git push origin develop
        shell: PowerShell
        env:
          JAVA_HOME: C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk\11.0.25-9\x64
          INPUT_VERSION: ${{ steps.increment_version.outputs.incremented_version }}
