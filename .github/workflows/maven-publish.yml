---
name: Maven Package
on:
  workflow_dispatch: null
  push:
    branches:
      - develop
  
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: "11"
          distribution: temurin
      - name: Read current version
        id: get_version
        run: |
          current_version=${{ github.workspace }}\coit-backend1\version\version.txt
          echo "::set-output name=version::$current_version"
          Write-Output "Version_current: $version"
          echo "::set-output name=version::$version"
      - name: Increment Version
        id: increment-version
        run: |
         current_version=${{ steps.get-version.outputs.version }}
         IFS='.' read -r major minor patch <<< "$current_version"
         new_version="$major.$minor.$((patch + 1))"
         echo "::set-output name=new-version::$new_version"
      - name: Build with Maven
        run: mvn install --file ${{ github.workspace }}//coit-backend1
        
      - name: Update Version in version.txt
        if: ${{ success() }}
        run: |
         new_version=${{ steps.increment-version.outputs.new-version }}
         sed -i "s/$current_version/$new_version/" ${{ github.workspace }}\coit-backend1\version\version.txt
      - name: Commit version increment
        run: |
         git config --global user.email "actions@github.com"
         git config --global user.name "GitHub Actions"
         git ${{ github.workspace }}\coit-backend1\version\version.txt
         git commit -m "Increment version to $new_version"
      
      - name: Push changes
        uses: ad-m/github-push-action@master
