# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Package

on:
  push:
    branches:
     - 'develop'
     
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'
    - name: Set up Maven
      run: |
        wget -q https://apache.mirrors.benatherton.com/maven/maven-3/3.8.4/binaries/apache-maven-3.8.4-bin.tar.gz
        tar -xzf apache-maven-3.8.4-bin.tar.gz
        export PATH=$PATH:/path/to/apache-maven-3.8.4/bin

    - name: Build with Maven
      run: mvn clean install --file ${{ github.workspace }}//coit-backend1
    - name: create a container
      run: docker build -t coit-backend1:${GIT_COMMIT} --file ${{ github.workspace }}//coit-backend1

    
      


